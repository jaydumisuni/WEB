name: Verify THETECHGUY tools live

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-ttg-tools-live.yml
      - verify-ttg-tools-live-trigger.md
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-ttg-tools-live

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify live routes and capture screenshots
        shell: bash
        continue-on-error: true
        run: |
          rm -rf evidence
          mkdir -p evidence
          cat > /tmp/verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const devices = [
            { name: 'desktop', width: 1440, height: 1000, mobile: false },
            { name: 'iphone', width: 390, height: 844, mobile: true },
            { name: 'small-phone', width: 320, height: 568, mobile: true }
          ];
          const routes = [
            { name: 'home', url: 'https://thetechguyds.com/' },
            { name: 'tools', url: 'https://thetechguyds.com/tools' },
            { name: 'tool-retired', url: 'https://thetechguyds.com/tool/' }
          ];
          const report = [];
          let browser;

          const shot = async (page, name) => page.screenshot({ path: `evidence/${name}.jpg`, type: 'jpeg', quality: 72, fullPage: false }).catch(() => {});

          try {
            browser = await chromium.launch({ headless: true });
            for (const device of devices) {
              const context = await browser.newContext({
                viewport: { width: device.width, height: device.height },
                isMobile: device.mobile,
                deviceScaleFactor: 1,
                userAgent: device.mobile
                  ? 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 Version/18.5 Mobile/15E148 Safari/604.1'
                  : 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/138 Safari/537.36'
              });

              for (const route of routes) {
                const result = { device: device.name, route: route.name, requestedUrl: route.url, errors: [] };
                let page;
                try {
                  page = await context.newPage();
                  page.on('pageerror', error => result.errors.push(`pageerror: ${String(error)}`));
                  page.on('console', message => { if (message.type() === 'error') result.errors.push(`console: ${message.text()}`); });
                  let response = null;
                  try {
                    response = await page.goto(`${route.url}${route.url.includes('?') ? '&' : '?'}proof=${Date.now()}-${device.name}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
                  } catch (error) {
                    result.errors.push(`goto: ${String(error)}`);
                  }
                  await page.waitForTimeout(6000).catch(() => {});
                  result.status = response?.status() || 0;
                  result.finalUrl = page.url();
                  result.title = await page.title().catch(() => '');
                  const text = await page.locator('body').innerText().catch(() => '');
                  result.text = text.slice(0, 1200);
                  result.hasHome = text.includes('Start Here');
                  result.hasTools = text.includes('One place for every') && text.includes('Tools coming soon');
                  result.hasBonny = Boolean(await page.locator('#bonny-launcher').count().catch(() => 0));
                  result.viewport = { width: device.width, height: device.height };
                  result.pageWidth = await page.evaluate(() => ({ scrollWidth: document.documentElement.scrollWidth, clientWidth: document.documentElement.clientWidth })).catch(() => null);
                  await shot(page, `${device.name}-${route.name}-initial`);

                  if (route.name === 'tools' && result.hasBonny) {
                    try {
                      const launcher = page.locator('#bonny-launcher');
                      const image = launcher.locator('img');
                      result.before = await launcher.boundingBox();
                      result.image = await image.evaluate(img => ({ naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight, src: img.src.slice(0, 50), complete: img.complete })).catch(error => ({ error: String(error) }));
                      await page.evaluate(() => window.scrollTo(0, Math.max(document.body.scrollHeight, document.documentElement.scrollHeight)));
                      await page.waitForTimeout(1200);
                      result.after = await launcher.boundingBox();
                      result.fixed = Boolean(result.before && result.after && Math.abs(result.before.x-result.after.x)<1 && Math.abs(result.before.y-result.after.y)<1);
                      await shot(page, `${device.name}-tools-scrolled`);
                      await launcher.click({ timeout: 10000 });
                      await page.waitForTimeout(800);
                      result.panelVisible = await page.locator('#bonny-panel').isVisible().catch(() => false);
                      result.panel = await page.locator('#bonny-panel').boundingBox().catch(() => null);
                      await shot(page, `${device.name}-tools-bonny-open`);
                      if (result.panelVisible) {
                        const textarea = page.locator('#bonny-panel textarea');
                        const send = page.locator('#bonny-panel .bonny-send');
                        if (await textarea.count() && await send.count()) {
                          await textarea.fill('What can you help me with?');
                          await send.click();
                          await page.waitForTimeout(12000);
                          result.messages = await page.locator('#bonny-panel .bonny-msg').allInnerTexts().catch(() => []);
                          await shot(page, `${device.name}-tools-bonny-response`);
                        } else {
                          result.errors.push('Bonny textarea or send button missing');
                        }
                      }
                    } catch (error) {
                      result.errors.push(`bonny: ${String(error)}`);
                    }
                  }
                } catch (error) {
                  result.errors.push(`route: ${String(error)}`);
                } finally {
                  report.push(result);
                  if (page) await page.close().catch(() => {});
                }
              }
              await context.close().catch(() => {});
            }
          } catch (error) {
            report.push({ fatal: String(error) });
          } finally {
            if (browser) await browser.close().catch(() => {});
            const summary = [
              '# Live result',
              '',
              ...report.map(x => x.fatal ? `- FATAL: ${x.fatal}` : `- ${x.device}/${x.route}: HTTP ${x.status || 0}; final=${x.finalUrl || ''}; home=${Boolean(x.hasHome)}; tools=${Boolean(x.hasTools)}; Bonny=${Boolean(x.hasBonny)}; fixed=${Boolean(x.fixed)}; image=${JSON.stringify(x.image || null)}; errors=${(x.errors || []).join(' | ')}`)
            ].join('\n');
            fs.writeFileSync('evidence/report.json', JSON.stringify(report, null, 2));
            fs.writeFileSync('evidence/report.md', summary);
            console.log(summary);
          }
          EOF
          node /tmp/verify.mjs

      - name: Commit temporary evidence to verification branch
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f evidence
          git diff --cached --quiet || git commit -m "Capture live tools visual evidence"
          git push origin HEAD:verify-ttg-tools-live

      - name: Update temporary verification issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('evidence/report.md') ? fs.readFileSync('evidence/report.md', 'utf8') : 'No report produced.';
            const base = 'https://raw.githubusercontent.com/jaydumisuni/WEB/verify-ttg-tools-live/evidence/';
            const images = [
              'iphone-home-initial.jpg',
              'iphone-tools-initial.jpg',
              'iphone-tools-scrolled.jpg',
              'iphone-tools-bonny-open.jpg',
              'iphone-tools-bonny-response.jpg',
              'iphone-tool-retired-initial.jpg',
              'desktop-tools-initial.jpg',
              'small-phone-tools-initial.jpg'
            ];
            const body = `Temporary verification evidence. Remove after completion.\n\n${report}\n\n## Screenshots\n\n${images.map(name => `### ${name}\n\n![${name}](${base}${name})`).join('\n\n')}`;
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 1, body });
