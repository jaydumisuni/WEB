name: Check deployment credentials

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/check-deploy-secrets.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret availability without exposing values
        id: check
        shell: bash
        env:
          CF1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF2: ${{ secrets.CF_API_TOKEN }}
          AC1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AC2: ${{ secrets.CF_ACCOUNT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          token=no; account=no; pat=no
          test -n "${CF1:-${CF2:-}}" && token=yes || true
          test -n "${AC1:-${AC2:-}}" && account=yes || true
          test -n "${GH_PAT:-${REPO_PAT:-}}" && pat=yes || true
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "account=$account" >> "$GITHUB_OUTPUT"
          echo "pat=$pat" >> "$GITHUB_OUTPUT"
      - name: Report availability
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Credential availability only: Cloudflare token=${{ steps.check.outputs.token }}, account=${{ steps.check.outputs.account }}, private-repo PAT=${{ steps.check.outputs.pat }}`
            });
